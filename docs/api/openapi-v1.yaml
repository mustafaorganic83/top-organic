openapi: 3.0.3
info:
  title: Top Organic API
  version: 1.0.0
  description: >
    Versioned API for Top Organic Enterprise Hybrid Restaurant ERP.
    Covers authentication, session, device, offline-login, RBAC, audit (Identity module)
    and catalog, shifts/drawers/tables, orders, customers, gift cards, billing,
    KDS, printing, and offline synchronization (Sales/POS module).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Sessions
  - name: Devices
  - name: Offline
  - name: Administration
  - name: Catalog
  - name: POS
  - name: Orders
  - name: Customers
  - name: GiftCards
  - name: Billing
  - name: KDS
  - name: Printing
  - name: Sync
  - name: Tables
  - name: Reservations
  - name: Waitlist
  - name: Reception
  - name: Kitchen
  - name: Menu
  - name: Recipes
  - name: Inventory
  - name: Accounting
  - name: Suppliers
  - name: AccountsPayable
  - name: AccountsReceivable
  - name: Bank
  - name: Budget
  - name: FinancialReports
  - name: Procurement
  - name: ProcurementRFQ
  - name: ProcurementPO
  - name: ProcurementReceiving
  - name: ProcurementContracts
  - name: HRDepartments
  - name: HREmployees
  - name: HRAttendance
  - name: HRGeofences
  - name: HRLeave
  - name: HRLoans
  - name: HRPayroll
  - name: HRPerformance
  - name: HRDocuments
  - name: HRTasks
  - name: Prepared
  - name: Costing
  - name: Snapshots
  - name: Production
  - name: Reports
  - name: Permissions
paths:
  # ─── ERP / Reports (v1 mirror of /api/reports) ─────────────────────────────
  /reports:
    get:
      tags: [Reports]
      operationId: listReports
      summary: List available reports
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
  /reports/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Reports]
      operationId: runReport
      summary: Run a report
      parameters:
        - name: format
          in: query
          schema: {type: string, enum: [json, csv, excel, pdf]}
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
  /reports/{key}/drilldown:
    parameters:
      - name: key
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Reports]
      operationId: drilldownReport
      summary: Drilldown into a report group
      responses:
        '200': {$ref: '#/components/responses/GenericData'}

  # ─── Recipes ────────────────────────────────────────────────────────────────
  /recipes:
    get:
      tags: [Recipes]
      operationId: listRecipes
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
    post:
      tags: [Recipes]
      operationId: createRecipe
      responses:
        '201': {$ref: '#/components/responses/GenericData'}
  /recipes/{recipe}:
    parameters:
      - name: recipe
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Ulid'}
    get:
      tags: [Recipes]
      operationId: getRecipe
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
  /recipes/{recipe}/versions:
    parameters:
      - name: recipe
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Ulid'}
    get:
      tags: [Recipes]
      operationId: listRecipeVersions
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
    post:
      tags: [Recipes]
      operationId: createRecipeVersion
      responses:
        '201': {$ref: '#/components/responses/GenericData'}
  /recipes/versions/{version}/publish:
    parameters:
      - name: version
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Ulid'}
    post:
      tags: [Recipes]
      operationId: publishRecipeVersion
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
  /recipes/versions/{version}/activate:
    parameters:
      - name: version
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Ulid'}
    post:
      tags: [Recipes]
      operationId: activateRecipeVersion
      responses:
        '200': {$ref: '#/components/responses/GenericData'}

  # ─── Prepared Items ─────────────────────────────────────────────────────────
  /prepared-items:
    get:
      tags: [Prepared]
      operationId: listPreparedItems
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
    post:
      tags: [Prepared]
      operationId: createPreparedItem
      responses:
        '201': {$ref: '#/components/responses/GenericData'}
  /prepared-items/{prepared}:
    parameters:
      - name: prepared
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Ulid'}
    get:
      tags: [Prepared]
      operationId: getPreparedItem
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
  /prepared-items/{prepared}/recipe:
    parameters:
      - name: prepared
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Ulid'}
    get:
      tags: [Prepared]
      operationId: getPreparedItemRecipe
      responses:
        '200': {$ref: '#/components/responses/GenericData'}

  # ─── Inventory ──────────────────────────────────────────────────────────────
  /inventory/stock-levels:
    get:
      tags: [Inventory]
      operationId: listStockLevels
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
  /inventory/movements:
    get:
      tags: [Inventory]
      operationId: listMovements
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
    post:
      tags: [Inventory]
      operationId: createMovement
      responses:
        '201': {$ref: '#/components/responses/GenericData'}

  # ─── Costing ────────────────────────────────────────────────────────────────
  /costing/ingredient/{stockItem}:
    parameters:
      - name: stockItem
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Ulid'}
    get:
      tags: [Costing]
      operationId: ingredientUnitCost
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
  /costing/recipes/{version}:
    parameters:
      - name: version
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Ulid'}
    get:
      tags: [Costing]
      operationId: recipeVersionCost
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
  /costing/recipes/{recipe}/active:
    parameters:
      - name: recipe
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Ulid'}
    get:
      tags: [Costing]
      operationId: recipeActiveCost
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
  /costing/snapshots:
    post:
      tags: [Snapshots]
      operationId: createCostSnapshot
      responses:
        '201': {$ref: '#/components/responses/GenericData'}

  # ─── Snapshots ──────────────────────────────────────────────────────────────
  /snapshots:
    get:
      tags: [Snapshots]
      operationId: listSnapshots
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
  /snapshots/{snapshot}:
    parameters:
      - name: snapshot
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Ulid'}
    get:
      tags: [Snapshots]
      operationId: getSnapshot
      responses:
        '200': {$ref: '#/components/responses/GenericData'}

  # ─── Production ─────────────────────────────────────────────────────────────
  /production/orders:
    get:
      tags: [Production]
      operationId: listProductionOrders
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
    post:
      tags: [Production]
      operationId: createProductionOrder
      responses:
        '201': {$ref: '#/components/responses/GenericData'}
  /production/orders/{order}:
    parameters:
      - name: order
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Ulid'}
    get:
      tags: [Production]
      operationId: getProductionOrder
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
  /production/orders/{order}/start:
    post:
      tags: [Production]
      operationId: startProductionOrder
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
  /production/orders/{order}/complete:
    post:
      tags: [Production]
      operationId: completeProductionOrder
      responses:
        '200': {$ref: '#/components/responses/GenericData'}

  # ─── Permissions ────────────────────────────────────────────────────────────
  /permissions:
    get:
      tags: [Permissions]
      operationId: listPermissions
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/TokenPair'}
        '202': {$ref: '#/components/responses/MfaRequired'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '423': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/mfa/complete:
    post:
      tags: [Authentication]
      operationId: completeMfa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MfaRequest'}
      responses:
        '200': {$ref: '#/components/responses/TokenPair'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/Error'}
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string, writeOnly: true, maxLength: 512}
      responses:
        '200': {$ref: '#/components/responses/TokenPair'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /me:
    get:
      tags: [Authentication]
      operationId: currentUser
      responses:
        '200':
          description: Current user and live permissions.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/DataEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      responses:
        '200': {$ref: '#/components/responses/Relogin'}
        '401': {$ref: '#/components/responses/Error'}
  /auth/logout-all:
    post:
      tags: [Authentication]
      operationId: logoutAll
      responses:
        '200': {$ref: '#/components/responses/Relogin'}
        '401': {$ref: '#/components/responses/Error'}
  /auth/password:
    post:
      tags: [Authentication]
      operationId: changePassword
      requestBody: {$ref: '#/components/requestBodies/ChangePassword'}
      responses:
        '200': {$ref: '#/components/responses/Relogin'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /auth/change-password:
    post:
      tags: [Authentication]
      operationId: changePasswordAlias
      requestBody: {$ref: '#/components/requestBodies/ChangePassword'}
      responses:
        '200': {$ref: '#/components/responses/Relogin'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Active sessions for the current user.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ListEnvelope'}
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /sessions/{session}:
    delete:
      tags: [Sessions]
      operationId: revokeSession
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
      responses:
        '200': {$ref: '#/components/responses/Revoked'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /devices/register:
    post:
      tags: [Devices]
      operationId: registerDevice
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterDeviceRequest'}
      responses:
        '201': {$ref: '#/components/responses/Device'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/Error'}
  /devices/{device}/trust:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
    post:
      tags: [Devices]
      operationId: trustCurrentDevice
      responses:
        '201':
          description: Opaque same-device trust token.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/DataEnvelope'}
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [device_id, trust_token, expires_at]
                        properties:
                          device_id: {$ref: '#/components/schemas/Ulid'}
                          trust_token: {type: string, writeOnly: true}
                          expires_at: {type: string, format: date-time}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Devices]
      operationId: revokeDeviceTrust
      responses:
        '200': {$ref: '#/components/responses/Revoked'}
        '404': {$ref: '#/components/responses/Error'}
  /offline-grants:
    post:
      tags: [Offline]
      operationId: issueOfflineGrant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, device_id]
              properties:
                branch_id: {$ref: '#/components/schemas/Ulid'}
                device_id: {$ref: '#/components/schemas/Ulid'}
      responses:
        '201':
          description: Offline grant metadata and signed offline JWT.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/DataEnvelope'}
                  - type: object
                    properties:
                      data:
                        allOf:
                          - {$ref: '#/components/schemas/OfflineGrant'}
                          - type: object
                            required: [grant_token]
                            properties:
                              grant_token: {type: string, writeOnly: true, description: Signed offline JWT; not an API bearer token.}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
    get:
      tags: [Offline]
      operationId: listOfflineGrants
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Current user's offline grants; token values are omitted.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ListEnvelope'}
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/OfflineGrant'}
  /offline-grants/{grant}:
    delete:
      tags: [Offline]
      operationId: revokeOfflineGrant
      parameters:
        - {$ref: '#/components/parameters/GrantId'}
      requestBody: {$ref: '#/components/requestBodies/Revoke'}
      responses:
        '200': {$ref: '#/components/responses/Revoked'}
        '404': {$ref: '#/components/responses/Error'}
  /offline-grants/{grant}/receipts:
    post:
      tags: [Offline]
      operationId: createOfflineReceipt
      parameters:
        - {$ref: '#/components/parameters/GrantId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OfflineReceiptRequest'}
      responses:
        '201':
          description: Stored receipt; duplicate client ID returns the original receipt.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/DataEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/OfflineReceipt'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/permission-groups:
    get:
      tags: [Administration]
      operationId: listPermissionGroups
      responses:
        '200': {$ref: '#/components/responses/PermissionGroups'}
        '403': {$ref: '#/components/responses/Error'}
  /admin/permission-catalog:
    get:
      tags: [Administration]
      operationId: listPermissionCatalogAlias
      responses:
        '200': {$ref: '#/components/responses/PermissionGroups'}
        '403': {$ref: '#/components/responses/Error'}
  /admin/permissions:
    get:
      tags: [Administration]
      operationId: listPermissions
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200': {$ref: '#/components/responses/Permissions'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/roles:
    get:
      tags: [Administration]
      operationId: listRoles
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
        - name: status
          in: query
          schema: {type: string, enum: [active, inactive]}
      responses:
        '200': {$ref: '#/components/responses/Roles'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Administration]
      operationId: createRole
      requestBody: {$ref: '#/components/requestBodies/Role'}
      responses:
        '201': {$ref: '#/components/responses/Role'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/roles/{role}:
    parameters:
      - {$ref: '#/components/parameters/RoleId'}
    get:
      tags: [Administration]
      operationId: getRole
      responses:
        '200': {$ref: '#/components/responses/Role'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [Administration]
      operationId: updateRole
      requestBody: {$ref: '#/components/requestBodies/Role'}
      responses:
        '200': {$ref: '#/components/responses/Role'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Administration]
      operationId: deleteRole
      responses:
        '200':
          description: Role deleted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BooleanActionEnvelope'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /admin/roles/{role}/permissions:
    put:
      tags: [Administration]
      operationId: replaceRolePermissions
      parameters:
        - {$ref: '#/components/parameters/RoleId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_ids]
              properties:
                permission_ids:
                  type: array
                  maxItems: 200
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/Ulid'}
      responses:
        '200': {$ref: '#/components/responses/Role'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/users/{user}/branches/{branch}/roles/{role}:
    post:
      tags: [Administration]
      operationId: grantBranchRole
      parameters:
        - {$ref: '#/components/parameters/UserId'}
        - {$ref: '#/components/parameters/BranchId'}
        - {$ref: '#/components/parameters/RoleId'}
      responses:
        '201':
          description: Branch role grant.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/DataEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/RoleGrant'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /admin/role-grants/{grant}:
    delete:
      tags: [Administration]
      operationId: revokeBranchRole
      parameters:
        - name: grant
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Ulid'}
      requestBody: {$ref: '#/components/requestBodies/Revoke'}
      responses:
        '200': {$ref: '#/components/responses/Revoked'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /admin/devices:
    get:
      tags: [Administration, Devices]
      operationId: listDevices
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/BranchQuery'}
        - name: status
          in: query
          schema: {type: string, enum: [pending, authorized, revoked]}
      responses:
        '200':
          description: Scope-filtered devices.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ListEnvelope'}
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/Device'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/devices/{device}:
    get:
      tags: [Administration, Devices]
      operationId: getDevice
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      responses:
        '200': {$ref: '#/components/responses/Device'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /admin/devices/{device}/approve:
    post:
      tags: [Administration, Devices]
      operationId: approveDevice
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      responses:
        '200': {$ref: '#/components/responses/Device'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /admin/devices/{device}/revoke:
    post:
      tags: [Administration, Devices]
      operationId: revokeDevice
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      requestBody: {$ref: '#/components/requestBodies/Revoke'}
      responses:
        '200': {$ref: '#/components/responses/Device'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /admin/audit:
    get:
      tags: [Administration]
      operationId: listAudit
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/BranchQuery'}
        - name: category
          in: query
          schema: {type: string, maxLength: 48}
      responses:
        '200': {$ref: '#/components/responses/AuditLogs'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/audit-logs:
    get:
      tags: [Administration]
      operationId: listAuditAlias
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
