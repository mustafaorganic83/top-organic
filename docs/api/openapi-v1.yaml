                initial_amount: {$ref: '#/components/schemas/MoneyAmount'}
                client_operation_id: {$ref: '#/components/schemas/ClientOperationId'}
                customer_id: {allOf: [{$ref: '#/components/schemas/Ulid'}], nullable: true}
                expires_at: {type: string, format: date-time, nullable: true}
      responses:
        '201': {$ref: '#/components/responses/GiftCard'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /sales/gift-cards/load:
    post:
      tags: [GiftCards]
      operationId: loadGiftCard
      summary: Top-up gift card (pos.device required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, currency, amount, client_operation_id]
              properties:
                token: {type: string, minLength: 16, maxLength: 255, writeOnly: true}
                currency: {type: string, minLength: 3, maxLength: 3}
                amount: {type: integer, minimum: 1, maximum: 9223372036854775807}
                client_operation_id: {$ref: '#/components/schemas/ClientOperationId'}
      responses:
        '201': {$ref: '#/components/responses/GiftCardTransaction'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /sales/gift-cards/balance:
    post:
      tags: [GiftCards]
      operationId: giftCardBalance
      summary: Check gift card balance by token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, minLength: 16, maxLength: 255, writeOnly: true}
      responses:
        '200': {$ref: '#/components/responses/GiftCard'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /sales/gift-cards/redeem:
    post:
      tags: [GiftCards]
      operationId: redeemGiftCard
      summary: Redeem gift card against order (pos.device required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, currency, amount, order_id, client_operation_id]
              properties:
                token: {type: string, minLength: 16, maxLength: 255, writeOnly: true}
                currency: {type: string, minLength: 3, maxLength: 3}
                amount: {type: integer, minimum: 1, maximum: 9223372036854775807}
                order_id: {$ref: '#/components/schemas/Ulid'}
                client_operation_id: {$ref: '#/components/schemas/ClientOperationId'}
      responses:
        '201': {$ref: '#/components/responses/GiftCardTransaction'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /sales/gift-cards/reverse:
    post:
      tags: [GiftCards]
      operationId: reverseGiftCard
      summary: Reverse a gift card transaction (pos.device required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_id, client_operation_id]
              properties:
                transaction_id: {$ref: '#/components/schemas/Ulid'}
                client_operation_id: {$ref: '#/components/schemas/ClientOperationId'}
      responses:
        '201': {$ref: '#/components/responses/GiftCardTransaction'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

  # ─── Billing ────────────────────────────────────────────────────────────────
  /sales/billing/payment-methods:
    get:
      tags: [Billing]
      operationId: listPaymentMethods
      summary: Active branch payment methods
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /sales/billing/payments:
    get:
      tags: [Billing]
      operationId: listPayments
      summary: Paginated payment list
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200': {$ref: '#/components/responses/PaymentList'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Billing]
      operationId: capturePayment
      summary: Capture payment (pos.device required)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CapturePaymentRequest'}
      responses:
        '201': {$ref: '#/components/responses/Payment'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /sales/billing/payments/{payment}/reverse:
    post:
      tags: [Billing]
      operationId: reversePayment
      summary: Reverse a payment (pos.device required)
      parameters:
        - name: payment
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Ulid'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason, client_operation_id]
              properties:
                amount: {$ref: '#/components/schemas/MoneyAmount'}
                reason: {type: string, maxLength: 500}
                client_operation_id: {$ref: '#/components/schemas/ClientOperationId'}
      responses:
        '201': {$ref: '#/components/responses/GenericData'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /sales/billing/invoices/{invoice}:
    get:
      tags: [Billing]
      operationId: getInvoice
      summary: Get invoice
      parameters:
        - name: invoice
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Ulid'}
      responses:
        '200': {$ref: '#/components/responses/Invoice'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /sales/billing/receipts/{invoice}:
    get:
      tags: [Billing]
      operationId: getReceipt
      summary: Get receipt (invoice with document_type=receipt)
      parameters:
        - name: invoice
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Ulid'}
      responses:
        '200': {$ref: '#/components/responses/Invoice'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /sales/billing/orders/{order}/settlement:
    get:
      tags: [Billing]
      operationId: orderSettlement
      summary: Settlement summary for order
      parameters:
        - {$ref: '#/components/parameters/OrderId'}
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  # ─── KDS ────────────────────────────────────────────────────────────────────
  /sales/kds/tickets:
    get:
      tags: [KDS]
      operationId: listKdsTickets
      summary: Active KDS tickets (queued, in_progress, ready)
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
        - name: state
          in: query
          schema: {type: string, enum: [queued, in_progress, ready]}
        - name: station_id
          in: query
          schema: {$ref: '#/components/schemas/Ulid'}
      responses:
        '200': {$ref: '#/components/responses/KdsTicketList'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /sales/kds/tickets/{ticket}:
    parameters:
      - name: ticket
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Ulid'}
    get:
      tags: [KDS]
      operationId: showKdsTicket
      summary: Show KDS ticket
      responses:
        '200': {$ref: '#/components/responses/KdsTicket'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /sales/kds/dispatch:
    post:
      tags: [KDS]
      operationId: dispatchKds
      summary: Dispatch order items to kitchen stations (pos.device:edge required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, client_operation_id]
              properties:
                order_id: {$ref: '#/components/schemas/Ulid'}
                client_operation_id: {$ref: '#/components/schemas/ClientOperationId'}
      responses:
        '201':
          description: Array of created/updated KDS tickets.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/DataEnvelope'}
                  - type: object
                    properties:
                      data: {type: array, items: {$ref: '#/components/schemas/KdsTicketResource'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /sales/kds/tickets/{ticket}/start:
    post:
      tags: [KDS]
      operationId: startKdsTicket
      summary: Start ticket — queued to in_progress (pos.device:edge required)
      parameters:
        - name: ticket
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Ulid'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KdsTransitionRequest'}
      responses:
        '200': {$ref: '#/components/responses/KdsTicket'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /sales/kds/tickets/{ticket}/ready:
    post:
      tags: [KDS]
      operationId: readyKdsTicket
      summary: Ready ticket — in_progress to ready (pos.device:edge required)
      parameters:
        - name: ticket
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Ulid'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KdsTransitionRequest'}
      responses:
        '200': {$ref: '#/components/responses/KdsTicket'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /sales/kds/tickets/{ticket}/bump:
    post:
      tags: [KDS]
      operationId: bumpKdsTicket
      summary: Bump ticket — ready to bumped (pos.device:edge required)
      parameters:
        - name: ticket
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Ulid'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KdsTransitionRequest'}
      responses:
        '200': {$ref: '#/components/responses/KdsTicket'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /sales/kds/tickets/{ticket}/recall:
    post:
      tags: [KDS]
      operationId: recallKdsTicket
      summary: Recall ticket — bumped to ready (pos.device:edge required)
      parameters:
        - name: ticket
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Ulid'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KdsTransitionRequest'}
      responses:
        '200': {$ref: '#/components/responses/KdsTicket'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

  # ─── Printing ───────────────────────────────────────────────────────────────
  /sales/printing/jobs:
    post:
      tags: [Printing]
      operationId: enqueuePrintJob
      summary: Enqueue print job (pos.device required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload_type, document_id, idempotency_key]
              properties:
                payload_type: {type: string, enum: [kitchen_ticket, receipt, invoice, barcode_label, qr_verification]}
                document_id: {$ref: '#/components/schemas/Ulid'}
                idempotency_key: {type: string, maxLength: 128}
                printer_id: {allOf: [{$ref: '#/components/schemas/Ulid'}], nullable: true}
                client_operation_id: {$ref: '#/components/schemas/ClientOperationId'}
      responses:
        '201': {$ref: '#/components/responses/PrintJob'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /sales/printing/jobs/{job}:
    get:
      tags: [Printing]
      operationId: showPrintJob
      summary: Show print job
      parameters:
        - name: job
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Ulid'}
      responses:
        '200': {$ref: '#/components/responses/PrintJob'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /sales/printing/edge/jobs/claim:
    post:
      tags: [Printing]
      operationId: claimPrintJob
      summary: Claim next pending job for this edge device (pos.device:edge required); returns null if none
      responses:
        '200':
          description: Claimed job or null.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/DataEnvelope'}
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - {$ref: '#/components/schemas/PrintJobResource'}
                          - {type: 'null'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /sales/printing/edge/jobs/{job}/complete:
    post:
      tags: [Printing]
      operationId: completePrintJob
      summary: Mark print job as printed (pos.device:edge required)
      parameters:
        - name: job
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Ulid'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExpectedVersionRequest'}
      responses:
        '200': {$ref: '#/components/responses/PrintJob'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /sales/printing/edge/jobs/{job}/fail:
    post:
      tags: [Printing]
      operationId: failPrintJob
      summary: Mark print job as failed (pos.device:edge required)
      parameters:
        - name: job
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Ulid'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, error_code, error_message]
              properties:
                expected_version: {$ref: '#/components/schemas/LockVersion'}
                error_code: {type: string, maxLength: 64, pattern: '^[A-Z0-9_]+$'}
                error_message: {type: string, maxLength: 1000}
      responses:
        '200': {$ref: '#/components/responses/PrintJob'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /sales/printing/edge/jobs/{job}/retry:
    post:
      tags: [Printing]
      operationId: retryPrintJob
      summary: Re-queue failed print job (pos.device:edge required)
      parameters:
        - name: job
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Ulid'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExpectedVersionRequest'}
      responses:
        '200': {$ref: '#/components/responses/PrintJob'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

  # ─── Offline Sync ───────────────────────────────────────────────────────────
  /sales/sync/push:
    post:
      tags: [Sync]
      operationId: syncPush
      summary: Push offline command batch (pos.device required)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SyncPushRequest'}
      responses:
        '200': {$ref: '#/components/responses/SyncPushResult'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /sales/sync/pull:
    get:
      tags: [Sync]
      operationId: syncPull
      summary: Pull change feed from cursor (pos.device required)
      parameters:
        - name: stream
          in: query
          schema: {type: string, maxLength: 64, pattern: '^[a-z][a-z0-9_]{1,63}$', default: default}
        - name: cursor
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200': {$ref: '#/components/responses/SyncPullResult'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /sales/sync/cursor:
    post:
      tags: [Sync]
      operationId: syncAcknowledge
      summary: Acknowledge pull high-water mark (pos.device required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sequence]
              properties:
                stream: {type: string, maxLength: 64, default: default}
                sequence: {type: integer, minimum: 0}
                resync: {type: boolean, default: false}
      responses:
        '200':
          description: Updated pull cursor.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/DataEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/SyncCursor'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /sales/sync/conflicts:
    get:
      tags: [Sync]
      operationId: listSyncConflicts
      summary: List open sync conflicts for this branch
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200': {$ref: '#/components/responses/ConflictList'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /sales/sync/conflicts/{conflict}/resolve:
    post:
      tags: [Sync]
      operationId: resolveConflict
      summary: Resolve a sync conflict (metadata-only; edge must re-submit corrected operations)
      parameters:
        - name: conflict
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Ulid'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resolution: {type: string, enum: [accept_remote, keep_local, discard], default: discard}
                reason: {type: string, nullable: true, maxLength: 500}
      responses:
        '200': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived API access JWT only. Opaque refresh tokens and offline JWTs are not accepted here.
  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PerPage:
      name: per_page
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    BranchQuery:
      name: branch_id
      in: query
      schema: {$ref: '#/components/schemas/Ulid'}
    SessionId:
      name: session
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    DeviceId:
      name: device
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    GrantId:
      name: grant
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    UserId:
      name: user
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    BranchId:
      name: branch
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    RoleId:
      name: role
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
  requestBodies:
    ChangePassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [current_password, password, password_confirmation]
            properties:
              current_password: {type: string, writeOnly: true, maxLength: 255}
              password: {type: string, writeOnly: true, maxLength: 255}
              password_confirmation: {type: string, writeOnly: true, maxLength: 255}
    Revoke:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              reason: {type: string, maxLength: 500}
    Role:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RoleRequest'}
  responses:
    Error:
      description: Stable error envelope.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ValidationErrorEnvelope'}
    TokenPair:
      description: Access JWT and opaque rotating refresh token.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/DataEnvelope'}
              - type: object
                properties:
                  data: {$ref: '#/components/schemas/TokenPair'}
    MfaRequired:
      description: Credentials accepted; MFA must be completed before tokens are issued.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/DataEnvelope'}
              - type: object
                properties:
                  data: {$ref: '#/components/schemas/MfaChallenge'}
    Relogin:
      description: Sessions revoked; full login is required.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/DataEnvelope'}
              - type: object
                properties:
                  data:
                    type: object
                    required: [requires_relogin]
                    properties:
                      revoked_sessions: {type: integer, minimum: 0}
                      requires_relogin: {type: boolean, enum: [true]}
    Revoked:
      description: Revocation completed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/BooleanActionEnvelope'}
    Device:
      description: Device metadata; key material is omitted.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/DataEnvelope'}
              - type: object
                properties:
                  data: {$ref: '#/components/schemas/Device'}
    Role:
      description: Role and permission details.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/DataEnvelope'}
              - type: object
                properties:
                  data: {$ref: '#/components/schemas/Role'}
    Roles:
      description: Paginated roles.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/ListEnvelope'}
              - type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Role'}}
    Permissions:
      description: Paginated permissions.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/ListEnvelope'}
              - type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Permission'}}
    PermissionGroups:
      description: Permission catalog grouped for administration UI.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/DataEnvelope'}
              - type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PermissionGroup'}}
    AuditLogs:
      description: Paginated scope-filtered audit records.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/ListEnvelope'}
              - type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/AuditLog'}}
  schemas:
    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
      example: 01J00000000000000000000000
    DataEnvelope:
      type: object
      required: [data]
      properties:
        data: {}
    ListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {}}
        meta: {$ref: '#/components/schemas/Pagination'}
    Pagination:
      type: object
      required: [current_page, per_page, total, last_page]
      properties:
        current_page: {type: integer, minimum: 1}
        per_page: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
        last_page: {type: integer, minimum: 1}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, example: UNAUTHENTICATED}
            message: {type: string}
            details: {type: object, additionalProperties: true}
    ValidationErrorEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ErrorEnvelope'}
        - type: object
          properties:
            error:
              type: object
              properties:
                fields:
                  type: object
                  additionalProperties:
                    type: array
                    items: {type: string}
    LoginRequest:
      type: object
      required: [tenant_slug, identifier, password]
      properties:
        tenant_slug: {type: string, maxLength: 100}
        identifier: {type: string, maxLength: 255, description: "Email, Iraqi mobile, or employee code."}
        password: {type: string, writeOnly: true, maxLength: 255}
        branch_id: {$ref: '#/components/schemas/Ulid'}
        device_id: {$ref: '#/components/schemas/Ulid'}
        remembered_device_token: {type: string, writeOnly: true, maxLength: 512}
    MfaRequest:
      type: object
      required: [challenge_token, response]
      properties:
        challenge_token: {type: string, writeOnly: true, maxLength: 512}
        response: {type: string, writeOnly: true, maxLength: 512}
    MfaChallenge:
      type: object
      required: [mfa_required, challenge_token, challenge_id]
      properties:
        mfa_required: {type: boolean, enum: [true]}
        challenge_token: {type: string, writeOnly: true}
        challenge_id: {$ref: '#/components/schemas/Ulid'}
    TokenPair:
      type: object
      required: [token_type, access_token, refresh_token, access_token_expires_at, refresh_token_expires_at, session_id]
      properties:
        token_type: {type: string, enum: [Bearer]}
        access_token: {type: string, writeOnly: true, description: Short-lived JWT with API audience.}
        refresh_token: {type: string, writeOnly: true, description: Opaque rotating token.}
        access_token_expires_at: {type: string, format: date-time}
        refresh_token_expires_at: {type: string, format: date-time}
        session_id: {$ref: '#/components/schemas/Ulid'}
    User:
      type: object
      required: [id, name, email, preferred_locale, tenant_id, permissions]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        name: {type: string}
        email: {type: string, format: email}
        phone: {type: string, nullable: true}
        employee_code: {type: string, nullable: true}
        preferred_locale: {type: string}
        tenant_id: {$ref: '#/components/schemas/Ulid'}
        branch_id: {allOf: [{$ref: '#/components/schemas/Ulid'}], nullable: true}
        device_id: {allOf: [{$ref: '#/components/schemas/Ulid'}], nullable: true}
        permissions: {type: array, uniqueItems: true, items: {type: string}}
    Session:
      type: object
      required: [id, authentication_method, expires_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        branch_id: {allOf: [{$ref: '#/components/schemas/Ulid'}], nullable: true}
        device_id: {allOf: [{$ref: '#/components/schemas/Ulid'}], nullable: true}
        authentication_method: {type: string}
        ip_address: {type: string, nullable: true}
        user_agent: {type: string, nullable: true}
        last_seen_at: {type: string, format: date-time, nullable: true}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time, nullable: true}
    RegisterDeviceRequest:
      type: object
      required: [tenant_slug, code, name, type, key_fingerprint]
      properties:
        tenant_slug: {type: string, maxLength: 100}
        branch_id: {allOf: [{$ref: '#/components/schemas/Ulid'}], nullable: true}
        code: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$'}
        name: {type: string, maxLength: 255}
        type: {type: string, enum: [pos, kiosk, mobile, desktop, other]}
        public_key: {type: string, maxLength: 8192, nullable: true, writeOnly: true}
        key_fingerprint: {type: string, minLength: 64, maxLength: 128, pattern: '^[a-fA-F0-9]+$', writeOnly: true}
        app_version: {type: string, maxLength: 64, nullable: true}
        os_version: {type: string, maxLength: 128, nullable: true}
    Device:
      type: object
      required: [id, code, name, type, status]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        branch_id: {allOf: [{$ref: '#/components/schemas/Ulid'}], nullable: true}
        code: {type: string}
        name: {type: string}
        type: {type: string, enum: [pos, kiosk, mobile, desktop, other]}
        status: {type: string, enum: [pending, authorized, revoked]}
        app_version: {type: string, nullable: true}
        os_version: {type: string, nullable: true}
        authorization_requested_at: {type: string, format: date-time, nullable: true}
        authorized_at: {type: string, format: date-time, nullable: true}
        revoked_at: {type: string, format: date-time, nullable: true}
        last_seen_at: {type: string, format: date-time, nullable: true}
    OfflineGrant:
      type: object
      required: [id, branch_id, device_id, issued_at, expires_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        branch_id: {$ref: '#/components/schemas/Ulid'}
        device_id: {$ref: '#/components/schemas/Ulid'}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time, nullable: true}
        revoked_at: {type: string, format: date-time, nullable: true}
    OfflineReceiptRequest:
      type: object
      required: [client_receipt_id, result, occurred_at]
      properties:
        client_receipt_id: {$ref: '#/components/schemas/Ulid'}
        result: {type: string, enum: [success, failure, denied]}
        occurred_at: {type: string, format: date-time}
        metadata: {type: object, maxProperties: 50, additionalProperties: true}
    OfflineReceipt:
      type: object
      required: [id, grant_id, client_receipt_id, result, occurred_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        grant_id: {$ref: '#/components/schemas/Ulid'}
        client_receipt_id: {$ref: '#/components/schemas/Ulid'}
        result: {type: string, enum: [success, failure, denied]}
        occurred_at: {type: string, format: date-time}
        synced_at: {type: string, format: date-time, nullable: true}
    RoleRequest:
      type: object
      properties:
        name: {type: string, maxLength: 80, pattern: '^[A-Za-z0-9 _-]+$'}
        label: {type: string, maxLength: 120}
        description: {type: string, maxLength: 1000, nullable: true}
        status: {type: string, enum: [active, inactive]}
        permission_ids: {type: array, maxItems: 200, uniqueItems: true, items: {$ref: '#/components/schemas/Ulid'}}
    Permission:
      type: object
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        name: {type: string}
        label: {type: string, nullable: true}
        description: {type: string, nullable: true}
        risk_level: {type: string}
        group_id: {allOf: [{$ref: '#/components/schemas/Ulid'}], nullable: true}
    PermissionGroup:
      type: object
      required: [id, code, name, permissions]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        code: {type: string}
        name: {type: string}
        description: {type: string, nullable: true}
        permissions: {type: array, items: {$ref: '#/components/schemas/Permission'}}
    Role:
      type: object
      required: [id, name, label, status, permissions]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        name: {type: string}
        label: {type: string}
        description: {type: string, nullable: true}
        status: {type: string, enum: [active, inactive]}
        permissions: {type: array, items: {$ref: '#/components/schemas/Permission'}}
        created_at: {type: string, format: date-time, nullable: true}
    RoleGrant:
      type: object
      required: [id, user_id, branch_id, role_id, effective_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        user_id: {$ref: '#/components/schemas/Ulid'}
        branch_id: {$ref: '#/components/schemas/Ulid'}
        role_id: {$ref: '#/components/schemas/Ulid'}
        effective_at: {type: string, format: date-time}
    AuditLog:
      type: object
      required: [id, category, action, source, result, occurred_at, recorded_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        branch_id: {allOf: [{$ref: '#/components/schemas/Ulid'}], nullable: true}
        category: {type: string}
        action: {type: string}
        source: {type: string}
        result: {type: string}
        reason: {type: string, nullable: true}
        actor_id: {allOf: [{$ref: '#/components/schemas/Ulid'}], nullable: true}
        occurred_at: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
    BooleanActionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: {type: boolean}