    post:
      tags: [KDS]
      operationId: readyKdsTicket
      summary: Ready ticket — in_progress to ready (pos.device:edge required)
      parameters:
        - name: ticket
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Ulid'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KdsTransitionRequest'}
      responses:
        '200': {$ref: '#/components/responses/KdsTicket'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
