                currency: {type: string, minLength: 3, maxLength: 3}
                amount: {type: integer, minimum: 1, maximum: 9223372036854775807}
                order_id: {$ref: '#/components/schemas/Ulid'}
                client_operation_id: {$ref: '#/components/schemas/ClientOperationId'}
      responses:
        '201': {$ref: '#/components/responses/GiftCardTransaction'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
