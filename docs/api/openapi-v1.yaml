openapi: 3.0.3
info:
  title: Top Organic API
  version: 1.0.0
  description: >
    Versioned API for Top Organic Enterprise Hybrid Restaurant ERP.
    Covers authentication, session, device, offline-login, RBAC, audit (Identity module)
    and catalog, shifts/drawers/tables, orders, customers, gift cards, billing,
    KDS, printing, and offline synchronization (Sales/POS module).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Sessions
  - name: Devices
  - name: Offline
  - name: Administration
  - name: Catalog
  - name: POS
  - name: Orders
  - name: Customers
  - name: GiftCards
  - name: Billing
  - name: KDS
  - name: Printing
  - name: Sync
paths:
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/TokenPair'}
        '202': {$ref: '#/components/responses/MfaRequired'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '423': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/mfa/complete:
    post:
      tags: [Authentication]
      operationId: completeMfa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MfaRequest'}
      responses:
        '200': {$ref: '#/components/responses/TokenPair'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/Error'}
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string, writeOnly: true, maxLength: 512}
      responses:
        '200': {$ref: '#/components/responses/TokenPair'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /me:
    get:
      tags: [Authentication]
      operationId: currentUser
      responses:
        '200':
          description: Current user and live permissions.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/DataEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      responses:
        '200': {$ref: '#/components/responses/Relogin'}
        '401': {$ref: '#/components/responses/Error'}
  /auth/logout-all:
    post:
      tags: [Authentication]
      operationId: logoutAll
      responses:
        '200': {$ref: '#/components/responses/Relogin'}
        '401': {$ref: '#/components/responses/Error'}
  /auth/password:
    post:
      tags: [Authentication]
      operationId: changePassword
      requestBody: {$ref: '#/components/requestBodies/ChangePassword'}
      responses:
        '200': {$ref: '#/components/responses/Relogin'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /auth/change-password:
    post:
      tags: [Authentication]
      operationId: changePasswordAlias
      requestBody: {$ref: '#/components/requestBodies/ChangePassword'}
      responses:
        '200': {$ref: '#/components/responses/Relogin'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Active sessions for the current user.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ListEnvelope'}
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /sessions/{session}:
    delete:
      tags: [Sessions]
      operationId: revokeSession
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
      responses:
        '200': {$ref: '#/components/responses/Revoked'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /devices/register:
    post:
      tags: [Devices]
      operationId: registerDevice
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterDeviceRequest'}
      responses:
        '201': {$ref: '#/components/responses/Device'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/Error'}
  /devices/{device}/trust:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
    post:
      tags: [Devices]
      operationId: trustCurrentDevice
      responses:
        '201':
          description: Opaque same-device trust token.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/DataEnvelope'}
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [device_id, trust_token, expires_at]
                        properties:
                          device_id: {$ref: '#/components/schemas/Ulid'}
                          trust_token: {type: string, writeOnly: true}
                          expires_at: {type: string, format: date-time}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Devices]
      operationId: revokeDeviceTrust
      responses:
        '200': {$ref: '#/components/responses/Revoked'}
        '404': {$ref: '#/components/responses/Error'}
  /offline-grants:
    post:
      tags: [Offline]
      operationId: issueOfflineGrant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, device_id]
              properties:
                branch_id: {$ref: '#/components/schemas/Ulid'}
                device_id: {$ref: '#/components/schemas/Ulid'}
      responses:
        '201':
          description: Offline grant metadata and signed offline JWT.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/DataEnvelope'}
                  - type: object
                    properties:
                      data:
                        allOf:
                          - {$ref: '#/components/schemas/OfflineGrant'}
                          - type: object
                            required: [grant_token]
                            properties:
                              grant_token: {type: string, writeOnly: true, description: Signed offline JWT; not an API bearer token.}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
    get:
      tags: [Offline]
      operationId: listOfflineGrants
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Current user's offline grants; token values are omitted.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ListEnvelope'}
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/OfflineGrant'}
  /offline-grants/{grant}:
    delete:
      tags: [Offline]
      operationId: revokeOfflineGrant
      parameters:
        - {$ref: '#/components/parameters/GrantId'}
      requestBody: {$ref: '#/components/requestBodies/Revoke'}
      responses:
        '200': {$ref: '#/components/responses/Revoked'}
        '404': {$ref: '#/components/responses/Error'}
  /offline-grants/{grant}/receipts:
    post:
      tags: [Offline]
      operationId: createOfflineReceipt
      parameters:
        - {$ref: '#/components/parameters/GrantId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OfflineReceiptRequest'}
      responses:
        '201':
          description: Stored receipt; duplicate client ID returns the original receipt.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/DataEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/OfflineReceipt'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/permission-groups:
    get:
      tags: [Administration]
      operationId: listPermissionGroups
      responses:
        '200': {$ref: '#/components/responses/PermissionGroups'}
        '403': {$ref: '#/components/responses/Error'}
  /admin/permission-catalog:
    get:
      tags: [Administration]
      operationId: listPermissionCatalogAlias
      responses:
        '200': {$ref: '#/components/responses/PermissionGroups'}
        '403': {$ref: '#/components/responses/Error'}
  /admin/permissions:
    get:
      tags: [Administration]
      operationId: listPermissions
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200': {$ref: '#/components/responses/Permissions'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/roles:
    get:
      tags: [Administration]
      operationId: listRoles
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
        - name: status
          in: query
          schema: {type: string, enum: [active, inactive]}
      responses:
        '200': {$ref: '#/components/responses/Roles'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Administration]
      operationId: createRole
      requestBody: {$ref: '#/components/requestBodies/Role'}
      responses:
        '201': {$ref: '#/components/responses/Role'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/roles/{role}:
    parameters:
      - {$ref: '#/components/parameters/RoleId'}
    get:
      tags: [Administration]
      operationId: getRole
      responses:
        '200': {$ref: '#/components/responses/Role'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [Administration]
      operationId: updateRole
      requestBody: {$ref: '#/components/requestBodies/Role'}
      responses:
        '200': {$ref: '#/components/responses/Role'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Administration]
      operationId: deleteRole
      responses:
        '200':
          description: Role deleted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BooleanActionEnvelope'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /admin/roles/{role}/permissions:
    put:
      tags: [Administration]
      operationId: replaceRolePermissions
      parameters:
        - {$ref: '#/components/parameters/RoleId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_ids]
              properties:
                permission_ids:
                  type: array
                  maxItems: 200
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/Ulid'}
      responses:
        '200': {$ref: '#/components/responses/Role'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/users/{user}/branches/{branch}/roles/{role}:
    post:
      tags: [Administration]
      operationId: grantBranchRole
      parameters:
        - {$ref: '#/components/parameters/UserId'}
        - {$ref: '#/components/parameters/BranchId'}
        - {$ref: '#/components/parameters/RoleId'}
      responses:
        '201':
          description: Branch role grant.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/DataEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/RoleGrant'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /admin/role-grants/{grant}:
    delete:
      tags: [Administration]
      operationId: revokeBranchRole
      parameters:
        - name: grant
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Ulid'}
      requestBody: {$ref: '#/components/requestBodies/Revoke'}
      responses:
        '200': {$ref: '#/components/responses/Revoked'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /admin/devices:
    get:
      tags: [Administration, Devices]
      operationId: listDevices
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/BranchQuery'}
        - name: status
          in: query
          schema: {type: string, enum: [pending, authorized, revoked]}
      responses:
        '200':
          description: Scope-filtered devices.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ListEnvelope'}
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/Device'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/devices/{device}:
    get:
      tags: [Administration, Devices]
      operationId: getDevice
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      responses:
        '200': {$ref: '#/components/responses/Device'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /admin/devices/{device}/approve:
    post:
      tags: [Administration, Devices]
      operationId: approveDevice
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      responses:
        '200': {$ref: '#/components/responses/Device'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /admin/devices/{device}/revoke:
    post:
      tags: [Administration, Devices]
      operationId: revokeDevice
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      requestBody: {$ref: '#/components/requestBodies/Revoke'}
      responses:
        '200': {$ref: '#/components/responses/Device'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /admin/audit:
    get:
      tags: [Administration]
      operationId: listAudit
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/BranchQuery'}
        - name: category
          in: query
          schema: {type: string, maxLength: 48}
      responses:
        '200': {$ref: '#/components/responses/AuditLogs'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/audit-logs:
    get:
      tags: [Administration]
      operationId: listAuditAlias
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
        - {$ref: '#/components/parameters/BranchQuery'}
        - name: category
          in: query
          schema: {type: string, maxLength: 48}
      responses:
        '200': {$ref: '#/components/responses/AuditLogs'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}

  # ─── Catalog ───────────────────────────────────────────────────────────────
  /sales/catalog:
    get:
      tags: [Catalog]
      operationId: listCatalog
      summary: Paginated active branch catalog
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
        - name: channel
          in: query
          schema: {type: string, enum: [pos, online, delivery, takeaway, dine_in]}
      responses:
        '200': {$ref: '#/components/responses/CatalogList'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /sales/catalog/barcode/scan:
    post:
      tags: [Catalog]
      operationId: scanBarcode
      summary: Look up catalog item by barcode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [barcode]
              properties:
                barcode: {type: string, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$'}
                channel: {type: string, enum: [pos, online, delivery, takeaway, dine_in]}
      responses:
        '200':
          description: Catalog item.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/DataEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/CatalogItem'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  # ─── POS shifts ────────────────────────────────────────────────────────────
  /pos/shifts:
    post:
      tags: [POS]
      operationId: openShift
      summary: Open POS shift (pos.device required)
      responses:
        '201': {$ref: '#/components/responses/Shift'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /pos/shifts/{shift}:
    parameters:
      - {$ref: '#/components/parameters/ShiftId'}
    get:
      tags: [POS]
      operationId: showShift
      summary: Show POS shift
      responses:
        '200': {$ref: '#/components/responses/Shift'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /pos/shifts/{shift}/close:
    post:
      tags: [POS]
      operationId: closeShift
      summary: Close POS shift (pos.device required)
      parameters:
        - {$ref: '#/components/parameters/ShiftId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExpectedVersionRequest'}
      responses:
        '200': {$ref: '#/components/responses/Shift'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /pos/drawers/sessions:
    post:
      tags: [POS]
      operationId: openDrawer
      summary: Open cash drawer session (pos.device required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shift_id, drawer_id, currency, opening_amount]
              properties:
                shift_id: {$ref: '#/components/schemas/Ulid'}
                drawer_id: {$ref: '#/components/schemas/Ulid'}
                currency: {type: string, minLength: 3, maxLength: 3}
                opening_amount: {$ref: '#/components/schemas/MoneyAmount'}
      responses:
        '201': {$ref: '#/components/responses/DrawerSession'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /pos/drawers/sessions/{session}/close:
    post:
      tags: [POS]
      operationId: closeDrawer
      summary: Close cash drawer session (pos.device required)
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [counted_amount, expected_version]
              properties:
                counted_amount: {$ref: '#/components/schemas/MoneyAmount'}
                expected_version: {$ref: '#/components/schemas/LockVersion'}
      responses:
        '200': {$ref: '#/components/responses/DrawerSession'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /pos/drawers/sessions/{session}/movements:
    post:
      tags: [POS]
      operationId: recordCashMovement
      summary: Record cash movement (pos.device required)
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, amount, currency, client_operation_id]
              properties:
                type: {type: string, enum: [cash_in, cash_out, sale, refund, adjustment]}
                amount: {type: integer, description: Non-zero signed integer minor units.}
                currency: {type: string, minLength: 3, maxLength: 3}
                client_operation_id: {$ref: '#/components/schemas/ClientOperationId'}
                reason: {type: string, maxLength: 500, nullable: true}
      responses:
        '201': {$ref: '#/components/responses/GenericData'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /pos/cash-movements/{movement}/reverse:
    post:
      tags: [POS]
      operationId: reverseCashMovement
      summary: Reverse a cash movement (pos.device required)
      parameters:
        - name: movement
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Ulid'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, client_operation_id]
              properties:
                reason: {type: string, maxLength: 500}
                client_operation_id: {$ref: '#/components/schemas/ClientOperationId'}
      responses:
        '201': {$ref: '#/components/responses/GenericData'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /pos/floors:
    get:
      tags: [POS]
      operationId: listFloors
      summary: Active floors with table layout and open sessions
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /pos/tables:
    get:
      tags: [POS]
      operationId: listTables
      summary: Active tables ordered by sort_order
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /pos/table-sessions:
    post:
      tags: [POS]
      operationId: openTableSession
      summary: Open table session (pos.device required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [table_id, guest_count]
              properties:
                table_id: {$ref: '#/components/schemas/Ulid'}
                guest_count: {type: integer, minimum: 1, maximum: 1000}
      responses:
        '201': {$ref: '#/components/responses/TableSession'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /pos/table-sessions/{session}/close:
    post:
      tags: [POS]
      operationId: closeTableSession
      summary: Close table session (pos.device required)
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
