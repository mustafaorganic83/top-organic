      tags: [Customers]
      operationId: createCustomer
      summary: Create customer (pos.device required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 255}
                phone: {type: string, nullable: true, maxLength: 32}
                email: {type: string, format: email, nullable: true, maxLength: 255}
                locale: {type: string, nullable: true, maxLength: 16}
      responses:
        '201': {$ref: '#/components/responses/Customer'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /sales/customers/search:
    get:
      tags: [Customers]
      operationId: searchCustomers
      summary: Customer search (alias of list with query)
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
        - name: query
          in: query
          schema: {type: string, maxLength: 255}
      responses:
        '200': {$ref: '#/components/responses/CustomerList'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /sales/customers/{customer}:
    parameters:
      - {$ref: '#/components/parameters/CustomerId'}
    get:
      tags: [Customers]
      operationId: showCustomer
      summary: Show customer
      responses:
        '200': {$ref: '#/components/responses/Customer'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [Customers]
      operationId: updateCustomer
      summary: Update customer (pos.device required, optimistic lock)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
                expected_version: {$ref: '#/components/schemas/LockVersion'}
                name: {type: string, maxLength: 255}
                phone: {type: string, nullable: true, maxLength: 32}
                email: {type: string, format: email, nullable: true, maxLength: 255}
                locale: {type: string, nullable: true, maxLength: 16}
                status: {type: string, enum: [active, inactive]}
      responses:
        '200': {$ref: '#/components/responses/Customer'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
