          required: true
          schema: {$ref: '#/components/schemas/Ulid'}
      responses:
        '200': {$ref: '#/components/responses/PrintJob'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
