          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, minLength: 16, maxLength: 255, writeOnly: true}
      responses:
        '200': {$ref: '#/components/responses/GiftCard'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
