          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/DataEnvelope'}
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - {$ref: '#/components/schemas/PrintJobResource'}
