      responses:
        '200': {$ref: '#/components/responses/GenericData'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived API access JWT only. Opaque refresh tokens and offline JWTs are not accepted here.
  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PerPage:
      name: per_page
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    BranchQuery:
      name: branch_id
      in: query
      schema: {$ref: '#/components/schemas/Ulid'}
    SessionId:
      name: session
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    DeviceId:
      name: device
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    GrantId:
      name: grant
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    UserId:
      name: user
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    BranchId:
      name: branch
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    RoleId:
      name: role
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
  requestBodies:
    KitchenAction:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [expected_version, client_operation_id]
            properties:
              expected_version: {type: integer, minimum: 0}
              client_operation_id: {type: string, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
              reason: {type: string, nullable: true, maxLength: 500}
    ChangePassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [current_password, password, password_confirmation]
            properties:
              current_password: {type: string, writeOnly: true, maxLength: 255}
              password: {type: string, writeOnly: true, maxLength: 255}
              password_confirmation: {type: string, writeOnly: true, maxLength: 255}
    Revoke:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              reason: {type: string, maxLength: 500}
    Role:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RoleRequest'}
    VersionOnly:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [expected_version]
            properties:
              expected_version: {type: integer, minimum: 0}
    ReservationConfirm:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [expected_version]
            properties:
              expected_version: {type: integer, minimum: 0}
              confirmation_channel: {type: string, nullable: true, maxLength: 32}
  responses:
    Error:
      description: Stable error envelope.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ValidationErrorEnvelope'}
    GenericData:
      description: Single resource wrapped in the standard data envelope.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DataEnvelope'}
    GenericList:
      description: Paginated collection wrapped in the standard list envelope.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ListEnvelope'}
    TokenPair:
      description: Access JWT and opaque rotating refresh token.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/DataEnvelope'}
              - type: object
                properties:
                  data: {$ref: '#/components/schemas/TokenPair'}
    MfaRequired:
      description: Credentials accepted; MFA must be completed before tokens are issued.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/DataEnvelope'}
              - type: object
                properties:
                  data: {$ref: '#/components/schemas/MfaChallenge'}
    Relogin:
      description: Sessions revoked; full login is required.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/DataEnvelope'}
              - type: object
                properties:
                  data:
                    type: object
                    required: [requires_relogin]
                    properties:
                      revoked_sessions: {type: integer, minimum: 0}
                      requires_relogin: {type: boolean, enum: [true]}
    Revoked:
      description: Revocation completed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/BooleanActionEnvelope'}
    Device:
      description: Device metadata; key material is omitted.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/DataEnvelope'}
              - type: object
                properties:
                  data: {$ref: '#/components/schemas/Device'}
    Role:
      description: Role and permission details.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/DataEnvelope'}
              - type: object
                properties:
                  data: {$ref: '#/components/schemas/Role'}
    Roles:
      description: Paginated roles.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/ListEnvelope'}
              - type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Role'}}
    Permissions:
      description: Paginated permissions.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/ListEnvelope'}
              - type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Permission'}}
    PermissionGroups:
      description: Permission catalog grouped for administration UI.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/DataEnvelope'}
              - type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PermissionGroup'}}
    AuditLogs:
      description: Paginated scope-filtered audit records.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/ListEnvelope'}
              - type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/AuditLog'}}
  schemas:
    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'
      example: 01J00000000000000000000000
    DataEnvelope:
      type: object
      required: [data]
      properties:
        data: {}
    ListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {}}
        meta: {$ref: '#/components/schemas/Pagination'}
    Pagination:
      type: object
      required: [current_page, per_page, total, last_page]
      properties:
        current_page: {type: integer, minimum: 1}
        per_page: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
        last_page: {type: integer, minimum: 1}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, example: UNAUTHENTICATED}
            message: {type: string}
            details: {type: object, additionalProperties: true}
    ValidationErrorEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ErrorEnvelope'}
        - type: object
          properties:
            error:
              type: object
              properties:
                fields:
                  type: object
                  additionalProperties:
                    type: array
                    items: {type: string}
    LoginRequest:
      type: object
      required: [tenant_slug, identifier, password]
      properties:
        tenant_slug: {type: string, maxLength: 100}
        identifier: {type: string, maxLength: 255, description: "Email, Iraqi mobile, or employee code."}
        password: {type: string, writeOnly: true, maxLength: 255}
        branch_id: {$ref: '#/components/schemas/Ulid'}
        device_id: {$ref: '#/components/schemas/Ulid'}
        remembered_device_token: {type: string, writeOnly: true, maxLength: 512}
    MfaRequest:
      type: object
      required: [challenge_token, response]
      properties:
        challenge_token: {type: string, writeOnly: true, maxLength: 512}
        response: {type: string, writeOnly: true, maxLength: 512}
    MfaChallenge:
      type: object
      required: [mfa_required, challenge_token, challenge_id]
      properties:
        mfa_required: {type: boolean, enum: [true]}
        challenge_token: {type: string, writeOnly: true}
        challenge_id: {$ref: '#/components/schemas/Ulid'}
    TokenPair:
      type: object
      required: [token_type, access_token, refresh_token, access_token_expires_at, refresh_token_expires_at, session_id]
      properties:
        token_type: {type: string, enum: [Bearer]}
        access_token: {type: string, writeOnly: true, description: Short-lived JWT with API audience.}
        refresh_token: {type: string, writeOnly: true, description: Opaque rotating token.}
        access_token_expires_at: {type: string, format: date-time}
        refresh_token_expires_at: {type: string, format: date-time}
        session_id: {$ref: '#/components/schemas/Ulid'}
    User:
      type: object
      required: [id, name, email, preferred_locale, tenant_id, permissions]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        name: {type: string}
        email: {type: string, format: email}
        phone: {type: string, nullable: true}
        employee_code: {type: string, nullable: true}
        preferred_locale: {type: string}
        tenant_id: {$ref: '#/components/schemas/Ulid'}
        branch_id: {type: string, nullable: true, pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'}
        device_id: {type: string, nullable: true, pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'}
        permissions: {type: array, uniqueItems: true, items: {type: string}}
    Session:
      type: object
      required: [id, authentication_method, expires_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        branch_id: {type: string, nullable: true, pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'}
        device_id: {type: string, nullable: true, pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'}
        authentication_method: {type: string}
        ip_address: {type: string, nullable: true}
        user_agent: {type: string, nullable: true}
        last_seen_at: {type: string, format: date-time, nullable: true}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time, nullable: true}
    RegisterDeviceRequest:
      type: object
      required: [tenant_slug, code, name, type, key_fingerprint]
      properties:
        tenant_slug: {type: string, maxLength: 100}
        branch_id: {type: string, nullable: true, pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'}
        code: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$'}
        name: {type: string, maxLength: 255}
        type: {type: string, enum: [pos, kiosk, mobile, desktop, other]}
        public_key: {type: string, maxLength: 8192, nullable: true, writeOnly: true}
        key_fingerprint: {type: string, minLength: 64, maxLength: 128, pattern: '^[a-fA-F0-9]+$', writeOnly: true}
        app_version: {type: string, maxLength: 64, nullable: true}
        os_version: {type: string, maxLength: 128, nullable: true}
    Device:
      type: object
      required: [id, code, name, type, status]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        branch_id: {type: string, nullable: true, pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'}
        code: {type: string}
        name: {type: string}
        type: {type: string, enum: [pos, kiosk, mobile, desktop, other]}
        status: {type: string, enum: [pending, authorized, revoked]}
        app_version: {type: string, nullable: true}
        os_version: {type: string, nullable: true}
        authorization_requested_at: {type: string, format: date-time, nullable: true}
        authorized_at: {type: string, format: date-time, nullable: true}
        revoked_at: {type: string, format: date-time, nullable: true}
        last_seen_at: {type: string, format: date-time, nullable: true}
    OfflineGrant:
      type: object
      required: [id, branch_id, device_id, issued_at, expires_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        branch_id: {$ref: '#/components/schemas/Ulid'}
        device_id: {$ref: '#/components/schemas/Ulid'}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time, nullable: true}
        revoked_at: {type: string, format: date-time, nullable: true}
    OfflineReceiptRequest:
      type: object
      required: [client_receipt_id, result, occurred_at]
      properties:
        client_receipt_id: {$ref: '#/components/schemas/Ulid'}
        result: {type: string, enum: [success, failure, denied]}
        occurred_at: {type: string, format: date-time}
        metadata: {type: object, maxProperties: 50, additionalProperties: true}
    OfflineReceipt:
      type: object
      required: [id, grant_id, client_receipt_id, result, occurred_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        grant_id: {$ref: '#/components/schemas/Ulid'}
        client_receipt_id: {$ref: '#/components/schemas/Ulid'}
        result: {type: string, enum: [success, failure, denied]}
        occurred_at: {type: string, format: date-time}
        synced_at: {type: string, format: date-time, nullable: true}
    RoleRequest:
      type: object
      properties:
        name: {type: string, maxLength: 80, pattern: '^[A-Za-z0-9 _-]+$'}
        label: {type: string, maxLength: 120}
        description: {type: string, maxLength: 1000, nullable: true}
        status: {type: string, enum: [active, inactive]}
        permission_ids: {type: array, maxItems: 200, uniqueItems: true, items: {$ref: '#/components/schemas/Ulid'}}
    Permission:
      type: object
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        name: {type: string}
        label: {type: string, nullable: true}
        description: {type: string, nullable: true}
        risk_level: {type: string}
        group_id: {type: string, nullable: true, pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'}
    PermissionGroup:
      type: object
      required: [id, code, name, permissions]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        code: {type: string}
        name: {type: string}
        description: {type: string, nullable: true}
        permissions: {type: array, items: {$ref: '#/components/schemas/Permission'}}
    Role:
      type: object
      required: [id, name, label, status, permissions]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        name: {type: string}
        label: {type: string}
        description: {type: string, nullable: true}
        status: {type: string, enum: [active, inactive]}
        permissions: {type: array, items: {$ref: '#/components/schemas/Permission'}}
        created_at: {type: string, format: date-time, nullable: true}
    RoleGrant:
      type: object
      required: [id, user_id, branch_id, role_id, effective_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        user_id: {$ref: '#/components/schemas/Ulid'}
        branch_id: {$ref: '#/components/schemas/Ulid'}
        role_id: {$ref: '#/components/schemas/Ulid'}
        effective_at: {type: string, format: date-time}
    AuditLog:
      type: object
      required: [id, category, action, source, result, occurred_at, recorded_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        branch_id: {type: string, nullable: true, pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'}
        category: {type: string}
        action: {type: string}
        source: {type: string}
        result: {type: string}
        reason: {type: string, nullable: true}
        actor_id: {type: string, nullable: true, pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26}$'}
        occurred_at: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
    BooleanActionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: {type: boolean}